<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消耗品変更 - びじゅありん</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="11_item_detail.html" style="width: 70px;">＜ キャンセル</a>
            <div>消耗品情報の変更</div>
            <div style="width: 70px;"></div>
        </header>
        <div class="content">
            <div class="form-group">
                <label>消耗品の名前</label>
                <input type="text" value="トイレットペーパー">
            </div>
            <div class="form-group">
                <label>現在の残量 (個/パック/本)</label>
                <input type="number" value="1">
            </div>
            <div class="form-group">
                <label>アラートの残量目安</label>
                <input type="number" value="2">
            </div>
            <div class="form-group">
                <label>購入サイクル (日)</label>
                <input type="number" value="14">
            </div>
            <div class="form-group">
                <label>カテゴリ</label>
                <select>
                    <option>未分類</option>
                    <option>キッチン</option>
                    <option>お風呂</option>
                    <option selected>トイレ</option>
                </select>
            </div>
            <a href="11_item_detail.html" class="btn" style="margin-top: 30px;">変更を保存する</a>
        </div>
    </div>
</body>
</html>
