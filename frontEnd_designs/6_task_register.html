<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タスク登録 - びじゅありん</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="5_home.html" style="width: 50px;">＜ 戻る</a>
            <div>タスク登録</div>
            <div style="width: 50px;"></div>
        </header>
        <div class="content">
            <div class="form-group">
                <label>家事の名前</label>
                <input type="text" placeholder="例：ゴミ出し">
            </div>
            <div class="form-group">
                <label>カテゴリ</label>
                <select>
                    <option>未分類</option>
                    <option>水回り</option>
                    <option>キッチン</option>
                    <option>リビング</option>
                </select>
            </div>
            <div class="form-group">
                <label>次回予定日</label>
                <input type="date">
            </div>
            <div class="form-group">
                <label>繰り返し間隔 (日)</label>
                <input type="number" placeholder="単発の場合は 0">
            </div>
            <div class="form-group">
                <label>詳細・メモ</label>
                <textarea rows="4" placeholder="具体的な手順や気をつけることなど"></textarea>
            </div>
            <a href="5_home.html" class="btn" style="margin-top: 30px;">登録する</a>
        </div>
    </div>
</body>
</html>
