<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タスク編集 - びじゅありん</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="7_task_detail.html" style="width: 70px;">＜ 戻る</a>
            <div>タスク編集</div>
            <div style="width: 70px;"></div>
        </header>
        <div class="content">
            <div class="form-group">
                <label>家事の名前</label>
                <input type="text" value="お風呂掃除">
            </div>
            <div class="form-group">
                <label>カテゴリ</label>
                <select>
                    <option>未分類</option>
                    <option selected>水回り</option>
                    <option>キッチン</option>
                    <option>リビング</option>
                </select>
            </div>
            <div class="form-group">
                <label>次回予定日</label>
                <input type="date" value="2026-07-03">
            </div>
            <div class="form-group">
                <label>繰り返し間隔 (日)</label>
                <input type="number" value="3">
            </div>
            <div class="form-group">
                <label>詳細・メモ</label>
                <textarea rows="4">排水溝のゴミも捨てること。カビキラーは月1回。</textarea>
            </div>
            <a href="7_task_detail.html" class="btn" style="margin-top: 30px;">変更を保存する</a>
        </div>
    </div>
</body>
</html>
