<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消耗品登録 - びじゅありん</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="5_home.html" style="width: 50px;">＜ 戻る</a>
            <div>消耗品登録</div>
            <div style="width: 50px;"></div>
        </header>
        <div class="content">
            <div class="form-group">
                <label>消耗品の名前</label>
                <input type="text" placeholder="例：食器用洗剤">
            </div>
            <div class="form-group">
                <label>現在の残量 (個/本)</label>
                <input type="number" value="1">
            </div>
            <div class="form-group">
                <label>アラートの残量目安</label>
                <input type="number" value="1">
            </div>
            <div class="form-group">
                <label>購入サイクル (日)</label>
                <input type="number" value="30">
            </div>
            <div class="form-group">
                <label>カテゴリ</label>
                <select>
                    <option>未分類</option>
                    <option>キッチン</option>
                    <option>お風呂</option>
                    <option>トイレ</option>
                </select>
            </div>
            <a href="5_home.html" class="btn" style="margin-top: 30px;">登録する</a>
        </div>
    </div>
</body>
</html>
